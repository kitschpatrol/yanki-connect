name: Compatibility

# Probes every client action against every Anki and AnkiConnect release
# combination on Linux, type-checks the responses, and reports loading
# boundaries and documented minimums. An explicitly accepted baseline gates
# regressions; incomplete collection also fails the run.
# Runs monthly on the 15th and on demand, with one job per Anki release.

on:
  schedule:
    - cron: '0 0 15 * *' # 00:00 UTC on the 15th of each month.
  workflow_dispatch:
    inputs:
      diagnose-gui-crash:
        description: 'Compare the QtWebEngine sandbox on/off with native backtraces for selected versions (defaults: Anki 2.1.49 + AnkiConnect 23.10.29.0; ignores baseline)'
        type: boolean
        required: false
        default: false
      anki-versions:
        description: 'Comma-separated Anki releases to test (empty = every Linux release, or 2.1.49 in diagnostic mode)'
        required: false
        default: ''
      anki-connect-versions:
        description: 'Comma-separated AnkiConnect releases to test (empty = every release since 22.2.19.0, or 23.10.29.0 in diagnostic mode)'
        required: false
        default: ''
      baseline-run-id:
        description: 'Accepted compatibility run ID (empty = repository variable COMPATIBILITY_BASELINE_RUN_ID, or discovery only)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.diagnose-gui-crash && 'gui-diagnostics' || 'survey' }}
  cancel-in-progress: true

jobs:
  versions:
    name: Enumerate releases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      anki: ${{ steps.versions.outputs.anki }}
      anki-connect: ${{ steps.versions.outputs.anki-connect }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Enumerate releases
        id: versions
        env:
          ANKI_VERSIONS: ${{ inputs.anki-versions || (inputs.diagnose-gui-crash && '2.1.49' || '') }}
          ANKI_CONNECT_VERSIONS: ${{ inputs.anki-connect-versions || (inputs.diagnose-gui-crash && '23.10.29.0' || '') }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/compatibility/versions.ts >> "$GITHUB_OUTPUT"

      - name: Export AnkiConnect releases
        env:
          ANKI_CONNECT_VERSIONS_JSON: ${{ steps.versions.outputs.anki-connect }}
        run: |
          git clone --quiet https://git.sr.ht/~foosoft/anki-connect "$RUNNER_TEMP/anki-connect"
          for tag in $(jq -r '.[]' <<< "$ANKI_CONNECT_VERSIONS_JSON"); do
            mkdir -p "plugins/$tag"
            git -C "$RUNNER_TEMP/anki-connect" archive "$tag" plugin | tar -x -C "plugins/$tag" --strip-components=1
          done

      - name: Upload AnkiConnect releases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anki-connect-plugins
          path: plugins
          retention-days: 7

  probe:
    name: Probe Anki ${{ matrix.anki.version }}${{ inputs.diagnose-gui-crash && format(' (sandbox {0})', matrix.sandbox) || '' }}
    needs: versions
    # Old bundled Qt libraries cannot load under the newer glibc in Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.diagnose-gui-crash && 25 || 150 }}
    strategy:
      fail-fast: false
      matrix:
        anki: ${{ fromJSON(needs.versions.outputs.anki) }}
        sandbox: ${{ fromJSON(inputs.diagnose-gui-crash && '["enabled", "disabled"]' || '["enabled"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            bzip2 \
            xvfb \
            openbox \
            mpv \
            zstd \
            libegl1 \
            libgl1 \
            libopengl0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxtst6 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libgbm1 \
            libasound2t64 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0

      - name: Verify media playback
        run: |
          mpv --version
          for media in scripts/compatibility/fixtures/audio.mp3 scripts/compatibility/fixtures/video.mp4; do
            mpv --no-config --include=scripts/compatibility/fixtures/mpv.conf --really-quiet "$media"
          done

      - name: Enable native crash capture
        if: ${{ inputs.diagnose-gui-crash }}
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gdb libc6-dbg
          mkdir -p "$RUNNER_TEMP/anki-cores"
          cat /proc/sys/kernel/core_pattern > "$RUNNER_TEMP/original-core-pattern"
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/anki-cores/core.%p.%E"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Build
        run: pnpm run build

      - name: Download AnkiConnect releases
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anki-connect-plugins
          path: plugins

      - name: Probe
        env:
          ANKI_RELEASE: ${{ toJSON(matrix.anki) }}
          ANKI_CONNECT_VERSIONS: ${{ needs.versions.outputs.anki-connect }}
          GUI_DIAGNOSTIC_SANDBOX: ${{ inputs.diagnose-gui-crash && matrix.sandbox || '' }}
        run: |
          mkdir -p results
          xvfb-run --auto-servernum bash <<'PROBE'
            set -euo pipefail
            diagnostic_args=()
            if [[ -n "$GUI_DIAGNOSTIC_SANDBOX" ]]; then
              ulimit -c unlimited
              node scripts/compatibility/native-crash.ts \
                --core-directory "$RUNNER_TEMP/anki-cores" \
                --output results/native-capture-check
              diagnostic_args=(
                --diagnostic-focus enabled
                --diagnostic-sandbox "$GUI_DIAGNOSTIC_SANDBOX"
                --core-directory "$RUNNER_TEMP/anki-cores"
              )
            fi
            openbox --sm-disable > results/window-manager.log 2>&1 &
            window_manager=$!
            trap 'kill "$window_manager" 2>/dev/null || true' EXIT
            node scripts/compatibility/run.ts \
              --anki-release "$ANKI_RELEASE" \
              --anki-connect-versions "$ANKI_CONNECT_VERSIONS" \
              --install-directory "$RUNNER_TEMP/anki" \
              --plugins plugins \
              --output results/anki.json \
              "${diagnostic_args[@]}"
          PROBE

      - name: Summarize GUI diagnostics
        if: ${{ !cancelled() && inputs.diagnose-gui-crash }}
        env:
          ANKI_VERSION: ${{ matrix.anki.version }}
          ANKI_CONNECT_VERSIONS: ${{ join(fromJSON(needs.versions.outputs.anki-connect), ', ') }}
          GUI_DIAGNOSTIC_SANDBOX: ${{ matrix.sandbox }}
        run: |
          {
            printf '## GUI crash diagnosis: sandbox %s\n\n' "$GUI_DIAGNOSTIC_SANDBOX"
            printf 'Anki %s + AnkiConnect %s. Focus and readiness checks are enabled in both jobs. Diagnostic results are excluded from compatibility baselines.\n\n' "$ANKI_VERSION" "$ANKI_CONNECT_VERSIONS"
            printf '| Stage | Process exit | QTWEBENGINE_DISABLE_SANDBOX | Native capture | Renderer cores | Action outcomes |\n| --- | --- | --- | --- | --- | --- |\n'
            for file in results/logs/*/preflight/process.json results/logs/*/*/attempt-*/process.json; do
              [[ -f "$file" ]] || continue
              directory="${file%/process.json}"
              exit_status=$(jq -r '(.signal // (.exitCode // "unknown" | tostring)) + (if .cleanup.signal then " (runner cleanup)" else "" end)' "$file")
              sandbox_override=$(jq -r '.qtWebEngineDisableSandbox // "unknown"' "$file")
              capture_status=missing
              renderer_cores=unknown
              if [[ -f "$directory/native-crash.json" ]]; then
                capture_status=$(jq -r '"\(.status) (\(.crashes | length) cores)"' "$directory/native-crash.json")
                renderer_cores=$(jq -r '[.crashes[] | select(.executable | endswith("/QtWebEngineProcess"))] | length' "$directory/native-crash.json")
              fi
              outcomes='not probed'
              if [[ -f "$directory/result.json" ]]; then
                outcomes=$(jq -r '.status + ": " + ([.actions[].status] | group_by(.) | map("\(.[0])=\(length)") | join(", "))' "$directory/result.json")
              fi
              printf '| %s | %s | %s | %s | %s | %s |\n' "${directory#results/logs/}" "$exit_status" "$sandbox_override" "$capture_status" "$renderer_cores" "$outcomes"
            done
            printf '\nSee the artifact for native backtraces, focus-call traces, and the native capture check.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.diagnose-gui-crash && 'compatibility-debug' || 'compatibility-anki' }}-${{ matrix.anki.version }}${{ inputs.diagnose-gui-crash && format('-sandbox-{0}', matrix.sandbox) || '' }}
          path: results
          retention-days: 90

      - name: Restore native crash settings
        if: ${{ always() && inputs.diagnose-gui-crash }}
        run: |
          if [[ -f "$RUNNER_TEMP/original-core-pattern" ]]; then
            original_pattern=$(cat "$RUNNER_TEMP/original-core-pattern")
            sudo sysctl -w "kernel.core_pattern=$original_pattern"
          fi

  report:
    name: Report
    needs: [versions, probe]
    if: ${{ !cancelled() && needs.versions.result == 'success' && !inputs.diagnose-gui-crash }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      BASELINE_RUN_ID: ${{ inputs.baseline-run-id || vars.COMPATIBILITY_BASELINE_RUN_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compatibility-anki-*
          path: results
          merge-multiple: false

      - name: Download accepted baseline
        if: ${{ !cancelled() && env.BASELINE_RUN_ID != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility
          path: baseline
          run-id: ${{ env.BASELINE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Build report
        if: ${{ !cancelled() }}
        env:
          ANKI_RELEASES: ${{ needs.versions.outputs.anki }}
          ANKI_CONNECT_VERSIONS: ${{ needs.versions.outputs.anki-connect }}
        run: |
          mkdir -p merged
          for file in results/*/anki.json; do
            if [[ -f "$file" ]]; then
              cp "$file" "merged/$(basename "$(dirname "$file")").json"
            fi
          done
          baseline_args=()
          if [[ -n "$BASELINE_RUN_ID" ]]; then
            baseline_args=(--baseline baseline/compatibility.json)
          fi
          node scripts/compatibility/report.ts --results merged --output compatibility \
            --anki-releases "$ANKI_RELEASES" \
            --anki-connect-versions "$ANKI_CONNECT_VERSIONS" \
            "${baseline_args[@]}"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility
          path: compatibility
          retention-days: 90
